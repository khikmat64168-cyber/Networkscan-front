name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # releases run their own checks in release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle includes font licenses
        run: test -f dist/FONT-LICENSES.txt && test -f dist/index.html
