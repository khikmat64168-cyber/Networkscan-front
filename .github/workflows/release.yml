name: Release

# Push a tag like v1.2.3 (matching package.json "version") to build the
# console and publish networkscan-front-<tag>.tar.gz (+ .sha256) as a GitHub
# Release.  The NST backend bundles the release pinned in its
# frontend.version into its Docker image and wheel, so shipping a new
# console means: release here, then bump frontend.version in the backend
# and release the backend.  No secrets are needed in this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          name="networkscan-front-$GITHUB_REF_NAME.tar.gz"
          tar -czf "$name" -C dist .
          sha256sum "$name" > "$name.sha256"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "networkscan-front-$GITHUB_REF_NAME.tar.gz" \
            "networkscan-front-$GITHUB_REF_NAME.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
